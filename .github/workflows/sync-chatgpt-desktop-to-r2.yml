name: Sync ChatGPT Desktop to R2

on:
  schedule:
    - cron: "43 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-chatgpt-desktop-to-r2
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: rabah-companion-downloads
      DOWNLOAD_BASE_URL: https://download.rabah.ai
    steps:
      - uses: actions/checkout@v4
      - name: Install AWS CLI
        shell: bash
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            pipx install awscli
          fi
          aws --version
      - name: Mirror and validate ChatGPT Desktop
        shell: bash
        run: bash scripts/sync-chatgpt-desktop-to-r2.sh
